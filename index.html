<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Collector ✨ | คลังความรู้ส่วนตัว</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #6c5ce7; /* ปรับเป็นสีม่วงอ่อน ให้ความรู้สึกสร้างสรรค์ */
            --secondary: #a29bfe;
            --bg: #f8f9fe;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --accent: #00cec9;
            --shadow: 0 15px 35px rgba(108, 92, 231, 0.12);
        }

        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 950px; margin: auto; }

        /* Login UI - Creative Style */
        .login-box {
            background: var(--card-bg);
            padding: 60px 40px;
            border-radius: 50px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 8vh;
            border: 8px solid #fff;
        }
        .icon-circle {
            width: 100px; height: 100px; background: #f0edff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; margin: 0 auto 20px;
        }

        .btn-google {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 16px 40px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 500; cursor: pointer;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3); transition: 0.3s;
        }
        .btn-google:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4); }

        /* Header & Panels */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; background: white; padding: 15px 25px;
            border-radius: 25px; box-shadow: var(--shadow);
        }
        .admin-panel {
            background: var(--card-bg); padding: 30px; border-radius: 35px;
            margin-bottom: 30px; box-shadow: var(--shadow);
        }
        .label { font-size: 0.9rem; color: var(--primary); font-weight: 500; margin-bottom: 12px; display: block; }
        
        input, select {
            flex: 1; padding: 14px 20px; border-radius: 18px; border: 2px solid #eee;
            background: #fdfdfd; color: var(--text-main); min-width: 200px; outline: none;
        }
        .btn-add {
            background: var(--primary); color: white; border: none; padding: 12px 25px;
            border-radius: 18px; font-weight: 500; cursor: pointer; transition: 0.3s;
        }
        .btn-cat { background: var(--accent); }

        /* Filter Area */
        .filter-area { text-align: center; margin-bottom: 30px; }
        #viewFilter {
            width: 100%; max-width: 450px; background: white;
            border-radius: 25px; border: 2px solid #fff; box-shadow: var(--shadow);
        }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .video-card {
            background: white; padding: 15px; border-radius: 25px;
            box-shadow: var(--shadow); position: relative; transition: 0.3s;
        }
        .video-card:hover { transform: translateY(-10px); }
        .iframe-wrap { position: relative; padding-top: 56.25%; border-radius: 15px; overflow: hidden; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .card-actions { display: flex; justify-content: center; gap: 15px; padding-top: 15px; }
        .tool-btn { background: #f8f9fe; border: none; padding: 8px 15px; border-radius: 12px; cursor: pointer; color: #666; transition: 0.2s; }
        .tool-btn:hover { background: var(--primary); color: white; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 15vh auto; padding: 35px; border-radius: 35px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.1); }

        @media (max-width: 600px) { .input-group { flex-direction: column; } }
        #mainApp, .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าแรก: Creative Inspiring Style -->
    <div id="loginPage" class="login-box">
        <div class="icon-circle">✨</div>
        <h1 style="color: var(--primary); margin-bottom: 10px; font-size: 2.5rem;">Knowledge Collector</h1>
        <p style="color: #636e72; font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px;">
            คัดสรรวิดีโอจากทั่วโลก มาเป็นคลังความรู้ส่วนตัวของคุณ <br> 
            จัดระเบียบทุกการเรียนรู้ ให้เติบโตได้ในที่เดียว
        </p>
        <button class="btn-google" onclick="login()">🚀 เข้าสู่คลังความรู้ของฉัน</button>
    </div>

    <!-- หน้าหลักหลัง Login -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info">
                <img id="userImg" src="">
                <span id="userName" style="font-weight: 500;">Workspace ของฉัน</span>
            </div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#b2bec3; cursor:pointer;">ลงชื่อออก</button>
        </div>

        <div class="admin-panel">
            <span class="label">📚 สร้างหมวดหมู่การเรียนรู้ใหม่</span>
            <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหมู่หลัก --</option></select>
                <input type="text" id="catInput" placeholder="เช่น วิทยาศาสตร์, ออกแบบ, ภาษา...">
                <button class="btn-add btn-cat" onclick="addCategory()">สร้างหน่วยความรู้</button>
            </div>
            
            <span class="label">🔗 บันทึกเนื้อหาใหม่ (YouTube URL)</span>
            <div class="input-group" style="display: flex; gap: 10px;">
                <select id="targetCatSelect"><option value="">-- เลือกหมวดเก็บข้อมูล --</option></select>
                <input type="text" id="videoUrl" placeholder="วางลิงก์วิดีโอที่นี่...">
                <button class="btn-add" onclick="addVideo()">บันทึกความรู้</button>
            </div>
        </div>

        <div class="filter-area">
            <select id="viewFilter" onchange="renderVideos()">
                <option value="all">💎 เปิดคลังความรู้ทั้งหมด</option>
            </select>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- Modal แก้ไข -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--primary); margin-bottom: 20px;">ย้ายหมวดหมู่ความรู้ 💡</h2>
        <select id="editCatSelect" style="width: 100%; margin-bottom: 20px;"></select>
        <button class="btn-add" style="width: 100%; margin-bottom: 10px;" onclick="saveEdit()">บันทึกการเปลี่ยนแปลง</button>
        <button class="tool-btn" style="width: 100%;" onclick="closeModal()">ยกเลิก</button>
    </div>
</div>

<script>
    // Config เดิมของคุณ
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let editingVideoKey = null;

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        const parentId = document.getElementById('parentCatSelect').value;
        if (!name) return;
        db.ref('users/' + currentUser.uid + '/categories').push({
            name: name,
            parentId: parentId === "none" ? null : parentId
        });
        document.getElementById('catInput').value = '';
    }

    function addVideo() {
        const catId = document.getElementById('targetCatSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = extractID(url);
        if (!catId || !vid) return alert("กรุณาเลือกหมวดและใส่ลิงก์ด้วยครับ");
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId,
            youtubeId: vid,
            addedAt: Date.now()
        });
        document.getElementById('videoUrl').value = '';
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openEditModal(key, currentCatId) {
        editingVideoKey = key;
        const editSelect = document.getElementById('editCatSelect');
        editSelect.innerHTML = document.getElementById('targetCatSelect').innerHTML;
        editSelect.value = currentCatId;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        editingVideoKey = null;
    }

    function saveEdit() {
        const newCatId = document.getElementById('editCatSelect').value;
        if (!newCatId || !editingVideoKey) return;
        db.ref('users/' + currentUser.uid + '/videos/' + editingVideoKey).update({
            catId: newCatId
        }).then(() => closeModal());
    }

    function deleteVideo(key) {
        if(confirm('ลบข้อมูลความรู้นี้หรือไม่?')) db.ref('users/' + currentUser.uid + '/videos/' + key).remove();
    }

    function updateDropdowns() {
        const pSel = document.getElementById('parentCatSelect');
        const tSel = document.getElementById('targetCatSelect');
        const fSel = document.getElementById('viewFilter');
        const currentFilter = fSel.value;

        const cats = myData.categories || {};
        const mainCats = [];
        const subCats = {};

        for (let id in cats) {
            if (!cats[id].parentId) mainCats.push({ id, ...cats[id] });
            else {
                if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = [];
                subCats[cats[id].parentId].push({ id, ...cats[id] });
            }
        }

        let pHTML = '<option value="none">-- เป็นหมวดหมู่หลักใหม่ --</option>';
        let tHTML = '<option value="">-- เลือกหน่วยความรู้ --</option>';
        let fHTML = '<option value="all">💎 เปิดคลังความรู้ทั้งหมด</option>';

        mainCats.forEach(main => {
            pHTML += `<option value="${main.id}">${main.name}</option>`;
            tHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            fHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            if (subCats[main.id]) {
                subCats[main.id].forEach(sub => {
                    tHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                    fHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                });
            }
        });

        pSel.innerHTML = pHTML; tSel.innerHTML = tHTML; fSel.innerHTML = fHTML;
        fSel.value = currentFilter;
    }

    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';

        const videos = myData.videos || {};
        const cats = myData.categories || {};
        
        let allowedCatIds = [filterVal];
        if (filterVal !== 'all') {
            for (let id in cats) {
                if (cats[id].parentId === filterVal) allowedCatIds.push(id);
            }
        }

        const keys = Object.keys(videos).sort((a, b) => (videos[b].addedAt || 0) - (videos[a].addedAt || 0));

        keys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && !allowedCatIds.includes(v.catId)) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe>
                </div>
                <div class="card-actions">
                    <button class="tool-btn" onclick="openEditModal('${key}', '${v.catId}')">ย้ายหมวด</button>
                    <button class="tool-btn" style="color:#ff7675" onclick="deleteVideo('${key}')">ลบ</button>
                </div>
            `;
            display.appendChild(card);
        });

        if (display.innerHTML === '') {
            display.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #b2bec3; padding: 40px;">คลังความรู้นี้ยังว่างเปล่า เริ่มบันทึกกันเลย ✨</p>';
        }
    }
</script>
</body>
</html>
