<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YT Cloud Playlist</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; --card: #1e1e1e; --text: #ffffff; --accent: #3ea6ff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        
        /* Login Page */
        .login-box { text-align: center; margin-top: 20vh; }
        .btn-google { background: white; color: black; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(255,255,255,0.1); }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info img { width: 35px; border-radius: 50%; border: 2px solid var(--accent); }
        .btn-logout { background: none; color: #888; border: 1px solid #444; padding: 5px 12px; border-radius: 5px; cursor: pointer; }

        /* Admin Panel */
        .admin-panel { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .section-label { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 10px; display: block; text-transform: uppercase; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: white; min-width: 150px; font-size: 1rem; }
        .btn-add { background: var(--red); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 120px; }
        .btn-cat { background: #333; }

        /* Filter Area */
        .filter-area { margin-bottom: 20px; background: #181818; padding: 15px; border-radius: 8px; border-left: 4px solid var(--red); }
        .filter-select { width: 100%; border-color: #444; font-weight: bold; color: var(--accent); }

        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: #000; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .iframe-wrap { position: relative; padding-top: 56.25%; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .del-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #ff4d4d; border: 1px solid #444; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        
        #mainApp, .hidden { display: none; }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .btn-add { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าเข้าสู่ระบบ -->
    <div id="loginPage" class="login-box">
        <h1 style="font-size: 4rem; margin-bottom: 10px;">📺</h1>
        <h1 style="margin-top: 0;">YT Playlist Cloud</h1>
        <p style="color: #888; margin-bottom: 30px;">จัดระเบียบวิดีโอ YouTube ของคุณ เปิดได้ทุกอุปกรณ์</p>
        <button class="btn-google" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/pwa-apple-180x180.png" width="20">
            เข้าสู่ระบบด้วย Google
        </button>
    </div>

    <!-- หน้าแอปหลัก -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info">
                <img id="userImg" src="">
                <span id="userName" style="font-weight: bold;"></span>
            </div>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div class="admin-panel">
            <span class="section-label">1. สร้างหมวดหมู่</span>
            <div class="input-group">
                <input type="text" id="catInput" placeholder="ชื่อหมวดหมู่ (เช่น เพลง, เกม, เรียน)...">
                <button class="btn-add btn-cat" onclick="addCategory()">+ สร้าง</button>
            </div>
            
            <span class="section-label">2. เพิ่มลิงก์วิดีโอ</span>
            <div class="input-group">
                <select id="catSelect"><option value="">-- เลือกหมวดหมู่ --</option></select>
                <input type="text" id="videoUrl" placeholder="วางลิงก์วิดีโอ YouTube ที่นี่...">
                <button class="btn-add" onclick="addVideo()">+ เพิ่มวิดีโอ</button>
            </div>
        </div>

        <!-- ตัวเลือกสำหรับกรองวิดีโอตามหมวดหมู่ -->
        <div class="filter-area">
            <span class="section-label" style="color: #888;">กำลังแสดงหมวดหมู่:</span>
            <select id="viewFilter" class="filter-select" onchange="renderVideos()">
                <option value="all">📂 วิดีโอทั้งหมด</option>
            </select>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<script>
    // --- ตั้งค่า Firebase ด้วยข้อมูลของคุณ ---
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    // เริ่มต้น Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };

    // ระบบ Login
    function login() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("เกิดข้อผิดพลาด: " + err.message));
    }

    function logout() {
        auth.signOut().then(() => location.reload());
    }

    // ตรวจสอบการเข้าสู่ระบบ
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            loadDataFromCloud();
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // ดึงข้อมูลจาก Firebase Realtime Database
    function loadDataFromCloud() {
        db.ref('users/' + currentUser.uid).on('value', snapshot => {
            myData = snapshot.val() || { categories: {}, videos: {} };
            renderDropdowns();
            renderVideos();
        });
    }

    // เพิ่มหมวดหมู่
    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        if (!name) return;
        db.ref('users/' + currentUser.uid + '/categories').push({ name: name });
        document.getElementById('catInput').value = '';
    }

    // เพิ่มวิดีโอ
    function addVideo() {
        const catId = document.getElementById('catSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = extractID(url);
        
        if (!catId || !vid) {
            alert("กรุณาเลือกหมวดหมู่และใส่ URL YouTube ให้ถูกต้อง");
            return;
        }
        
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId,
            youtubeId: vid,
            addedAt: Date.now()
        });
        document.getElementById('videoUrl').value = '';
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function deleteVideo(key) {
        if(confirm('ต้องการลบวิดีโอนี้ใช่หรือไม่?')) {
            db.ref('users/' + currentUser.uid + '/videos/' + key).remove();
        }
    }

    // อัปเดตตัวเลือกหมวดหมู่ใน Dropdowns
    function renderDropdowns() {
        const catSelect = document.getElementById('catSelect');
        const viewFilter = document.getElementById('viewFilter');
        const currentFilter = viewFilter.value;
        
        let html = '<option value="">-- เลือกหมวดหมู่ --</option>';
        let filterHtml = '<option value="all">📂 วิดีโอทั้งหมด</option>';
        
        const cats = myData.categories || {};
        for (let key in cats) {
            html += `<option value="${key}">${cats[key].name}</option>`;
            filterHtml += `<option value="${key}">${cats[key].name}</option>`;
        }
        catSelect.innerHTML = html;
        viewFilter.innerHTML = filterHtml;
        viewFilter.value = currentFilter;
    }

    // แสดงรายการวิดีโอ
    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';

        const videos = myData.videos || {};
        // เรียงจากวิดีโอที่เพิ่มล่าสุดขึ้นก่อน
        const keys = Object.keys(videos).sort((a, b) => (videos[b].addedAt || 0) - (videos[a].addedAt || 0));

        keys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && v.catId !== filterVal) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe>
                </div>
                <button class="del-btn" onclick="deleteVideo('${key}')">×</button>
            `;
            display.appendChild(card);
        });

        if (display.innerHTML === '') {
            display.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #555; padding: 40px;">ไม่พบวิดีโอในหมวดหมู่นี้</p>';
        }
    }
</script>

</body>
</html>
