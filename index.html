<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Cloud Playlist - Edit Mode</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; --card: #1e1e1e; --text: #ffffff; --accent: #3ea6ff; --gray: #888; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 950px; margin: auto; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 15% auto; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }

        .login-box { text-align: center; margin-top: 20vh; }
        .btn-google { background: white; color: black; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .user-info img { width: 30px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }

        .admin-panel { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .label { font-size: 0.8rem; color: var(--accent); font-weight: bold; display: block; margin-bottom: 8px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        
        input, select { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #121212; color: white; min-width: 140px; }
        button { padding: 10px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background: var(--red); color: white; }
        .btn-cat { background: #444; color: white; }
        .btn-save { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-cancel { background: #333; color: white; width: 100%; margin-top: 5px; }

        .filter-area { background: #181818; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--red); }
        
        /* Video Grid */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .video-card { background: #000; border-radius: 10px; overflow: hidden; position: relative; }
        .iframe-wrap { position: relative; padding-top: 56.25%; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Action Buttons on Card */
        .card-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; }
        .action-btn { background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; }
        .btn-edit-tool { color: var(--accent); }
        .btn-del-tool { color: #ff4d4d; }

        #mainApp, .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage" class="login-box">
        <h1>📺 YT Cloud Playlist</h1>
        <button class="btn-google" onclick="login()">Sign in with Google</button>
    </div>

    <div id="mainApp">
        <div class="header">
            <div class="user-info"><img id="userImg" src=""> <span id="userName"></span></div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#888; cursor:pointer;">Logout</button>
        </div>

        <div class="admin-panel">
            <span class="label">1. จัดการหมวดหมู่ (สร้างหลัก หรือ ย่อย)</span>
            <div class="input-group">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหมู่หลักใหม่ --</option></select>
                <input type="text" id="catInput" placeholder="ชื่อหมวดหมู่...">
                <button class="btn-cat" onclick="addCategory()">+ สร้างหมวดหมู่</button>
            </div>
            
            <span class="label">2. เพิ่มวิดีโอลงในหมวดหมู่</span>
            <div class="input-group">
                <select id="targetCatSelect"><option value="">-- เลือกหมวดหมู่ --</option></select>
                <input type="text" id="videoUrl" placeholder="ลิงก์ YouTube...">
                <button class="btn-add" onclick="addVideo()">+ เพิ่มวิดีโอ</button>
            </div>
        </div>

        <div class="filter-area">
            <span class="label">เลือกดูหมวดหมู่:</span>
            <select id="viewFilter" onchange="renderVideos()" style="width:100%; color:var(--accent); font-weight:bold;">
                <option value="all">📁 แสดงทั้งหมด</option>
            </select>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- หน้าต่างแก้ไข (Edit Modal) -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>ย้ายหมวดหมู่</h3>
        <p id="editVideoTitle" style="font-size: 0.8rem; color: #888;"></p>
        <select id="editCatSelect" style="width: 100%; margin: 10px 0;"></select>
        <button class="btn-save" onclick="saveEdit()">บันทึกการย้าย</button>
        <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let editingVideoKey = null; // เก็บ key ของวิดีโอที่กำลังแก้ไข

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        const parentId = document.getElementById('parentCatSelect').value;
        if (!name) return;
        db.ref('users/' + currentUser.uid + '/categories').push({
            name: name,
            parentId: parentId === "none" ? null : parentId
        });
        document.getElementById('catInput').value = '';
    }

    function addVideo() {
        const catId = document.getElementById('targetCatSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = extractID(url);
        if (!catId || !vid) return alert("ข้อมูลไม่ครบ");
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId,
            youtubeId: vid,
            addedAt: Date.now()
        });
        document.getElementById('videoUrl').value = '';
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    // --- ฟังก์ชันแก้ไข ---
    function openEditModal(key, currentCatId) {
        editingVideoKey = key;
        const editSelect = document.getElementById('editCatSelect');
        editSelect.innerHTML = document.getElementById('targetCatSelect').innerHTML;
        editSelect.value = currentCatId;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        editingVideoKey = null;
    }

    function saveEdit() {
        const newCatId = document.getElementById('editCatSelect').value;
        if (!newCatId || !editingVideoKey) return;
        
        db.ref('users/' + currentUser.uid + '/videos/' + editingVideoKey).update({
            catId: newCatId
        }).then(() => {
            closeModal();
        });
    }

    function deleteVideo(key) {
        if(confirm('ลบวิดีโอนี้?')) db.ref('users/' + currentUser.uid + '/videos/' + key).remove();
    }

    function updateDropdowns() {
        const pSel = document.getElementById('parentCatSelect');
        const tSel = document.getElementById('targetCatSelect');
        const fSel = document.getElementById('viewFilter');
        const currentFilter = fSel.value;

        const cats = myData.categories || {};
        const mainCats = [];
        const subCats = {};

        for (let id in cats) {
            if (!cats[id].parentId) {
                mainCats.push({ id, ...cats[id] });
            } else {
                if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = [];
                subCats[cats[id].parentId].push({ id, ...cats[id] });
            }
        }

        let tHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';
        let fHTML = '<option value="all">📁 แสดงทั้งหมด</option>';
        let pHTML = '<option value="none">-- เป็นหมวดหมู่หลักใหม่ --</option>';

        mainCats.forEach(main => {
            pHTML += `<option value="${main.id}">${main.name}</option>`;
            tHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            fHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            if (subCats[main.id]) {
                subCats[main.id].forEach(sub => {
                    tHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                    fHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                });
            }
        });

        pSel.innerHTML = pHTML;
        tSel.innerHTML = tHTML;
        fSel.innerHTML = fHTML;
        fSel.value = currentFilter;
    }

    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';

        const videos = myData.videos || {};
        const cats = myData.categories || {};
        
        let allowedCatIds = [filterVal];
        if (filterVal !== 'all') {
            for (let id in cats) {
                if (cats[id].parentId === filterVal) allowedCatIds.push(id);
            }
        }

        const keys = Object.keys(videos).sort((a, b) => (videos[b].addedAt || 0) - (videos[a].addedAt || 0));

        keys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && !allowedCatIds.includes(v.catId)) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe>
                </div>
                <div class="card-actions">
                    <button class="action-btn btn-edit-tool" onclick="openEditModal('${key}', '${v.catId}')">✎</button>
                    <button class="action-btn btn-del-tool" onclick="deleteVideo('${key}')">×</button>
                </div>
            `;
            display.appendChild(card);
        });
    }
</script>
</body>
</html>
