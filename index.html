<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Playlist Hub</title>
    <style>
        /* Modern Design & Reset */
        :root {
            --primary-red: #ff0000;
            --bg-color: #f9f9f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #065fd4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f0f0f;
                --text-color: #f1f1f1;
                --card-bg: #1e1e1e;
            }
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 2rem; color: var(--primary-red); margin-bottom: 10px; }

        /* Admin Panel / Input Styles */
        .admin-panel {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input, select {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
        }

        button {
            padding: 12px 25px;
            background-color: var(--primary-red);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover { background-color: #cc0000; transform: translateY(-1px); }
        .btn-secondary { background-color: #555; }
        .btn-secondary:hover { background-color: #333; }

        /* Playlist Display */
        .category-block {
            margin-bottom: 50px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .category-header h2 { margin: 0; font-size: 1.5rem; }

        .btn-delete-cat {
            background: none;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
        .btn-delete-cat:hover { background: #ff4d4d; color: #fff; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .video-card:hover { transform: scale(1.02); }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .iframe-container iframe {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .video-actions {
            padding: 10px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-del-video {
            background: none;
            color: #888;
            font-size: 0.8rem;
            padding: 5px;
        }
        .btn-del-video:hover { color: red; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .input-group { flex-direction: column; }
            input, select, button { width: 100%; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 My YouTube Playlists</h1>
        <p>สร้างเพลย์ลิสต์ส่วนตัว จัดหมวดหมู่ได้ตามใจ</p>
    </header>

    <div class="admin-panel">
        <span class="section-title">1. จัดการหมวดหมู่</span>
        <div class="input-group">
            <input type="text" id="catInput" placeholder="ใส่ชื่อหมวดหมู่ เช่น เพลงโปรด, บทเรียน...">
            <button class="btn-secondary" onclick="addCategory()">+ สร้างหมวดหมู่</button>
        </div>

        <span class="section-title">2. เพิ่มวิดีโอ</span>
        <div class="input-group">
            <select id="catSelect">
                <option value="">-- เลือกหมวดหมู่ --</option>
            </select>
            <input type="text" id="videoUrl" placeholder="วางลิงก์ YouTube ที่นี่...">
            <button onclick="addVideo()">+ เพิ่มวิดีโอ</button>
        </div>
    </div>

    <!-- ส่วนแสดงผล -->
    <div id="playlistDisplay"></div>
</div>

<script>
    // ดึงข้อมูลจาก LocalStorage
    let db = JSON.parse(localStorage.getItem('myYTData')) || [];

    // ฟังก์ชันดึง Video ID จาก URL แบบครอบคลุม
    function getYoutubeID(url) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regex);
        return (match && match[1]) ? match[1] : null;
    }

    // บันทึกและวาดใหม่
    function refresh() {
        localStorage.setItem('myYTData', JSON.stringify(db));
        render();
    }

    // เพิ่มหมวดหมู่
    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        if (!name) return alert("กรุณาใส่ชื่อหมวดหมู่");
        
        db.push({ id: Date.now(), name: name, videos: [] });
        document.getElementById('catInput').value = '';
        refresh();
    }

    // ลบหมวดหมู่
    function deleteCategory(id) {
        if (confirm("คุณแน่ใจนะว่าต้องการลบหมวดหมู่นี้พร้อมวิดีโอทั้งหมด?")) {
            db = db.filter(item => item.id !== id);
            refresh();
        }
    }

    // เพิ่มวิดีโอ
    function addVideo() {
        const catIdx = document.getElementById('catSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = getYoutubeID(url);

        if (catIdx === "" || !vid) {
            return alert("กรุณาเลือกหมวดหมู่และวางลิงก์ YouTube ให้ถูกต้อง");
        }

        db[catIdx].videos.push({
            id: Date.now(),
            youtubeId: vid
        });

        document.getElementById('videoUrl').value = '';
        refresh();
    }

    // ลบวิดีโอ
    function deleteVideo(catIdx, videoId) {
        db[catIdx].videos = db[catIdx].videos.filter(v => v.id !== videoId);
        refresh();
    }

    // ฟังก์ชันแสดงผล HTML
    function render() {
        const display = document.getElementById('playlistDisplay');
        const select = document.getElementById('catSelect');
        
        display.innerHTML = '';
        select.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';

        if (db.length === 0) {
            display.innerHTML = `<p style="text-align:center; color:#888;">ยังไม่มีหมวดหมู่ เริ่มต้นโดยการสร้างหมวดหมู่ใหม่ด้านบน</p>`;
        }

        db.forEach((cat, cIdx) => {
            // เติม Select Dropdown
            const opt = document.createElement('option');
            opt.value = cIdx;
            opt.textContent = cat.name;
            select.appendChild(opt);

            // สร้าง UI หมวดหมู่
            const section = document.createElement('div');
            section.className = 'category-block';
            
            let videoHtml = '';
            cat.videos.forEach(v => {
                videoHtml += `
                    <div class="video-card">
                        <div class="iframe-container">
                            <iframe 
                                src="https://www.youtube.com/embed/${v.youtubeId}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div class="video-actions">
                            <button class="btn-del-video" onclick="deleteVideo(${cIdx}, ${v.id})">ลบวิดีโอ</button>
                        </div>
                    </div>
                `;
            });

            section.innerHTML = `
                <div class="category-header">
                    <h2>${cat.name} (${cat.videos.length})</h2>
                    <button class="btn-delete-cat" onclick="deleteCategory(${cat.id})">ลบหมวดหมู่</button>
                </div>
                <div class="video-grid">
                    ${videoHtml || '<p style="color:#888;">ยังไม่มีวิดีโอในหมวดหมู่นี้</p>'}
                </div>
            `;
            display.appendChild(section);
        });
    }

    // รันตอนเริ่ม
    render();
</script>

</body>
</html>
