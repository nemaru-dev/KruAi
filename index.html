<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ My YT Sweet Playlist</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #ff7e67;
            --secondary: #ffb199;
            --bg: #fff5f5;
            --card-bg: #ffffff;
            --text-main: #5d4a4a;
            --accent: #74ebd5;
            --shadow: 0 10px 25px rgba(255, 126, 103, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Mitr', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#ff7e6711 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: auto; }

        /* Login UI */
        .login-box {
            background: var(--card-bg);
            padding: 50px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 10vh;
            border: 4px solid #fff;
        }

        .btn-google {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 126, 103, 0.4);
            transition: 0.3s;
        }
        .btn-google:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(255, 126, 103, 0.6); }

        /* Header UI */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 45px; border-radius: 50%; border: 3px solid #fff; box-shadow: var(--shadow); }

        /* Panel UI */
        .admin-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 35px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 3px solid #fff;
        }

        .label { font-size: 0.9rem; color: var(--primary); font-weight: 500; margin-bottom: 10px; display: block; }
        
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        
        input, select {
            flex: 1;
            padding: 14px 20px;
            border-radius: 20px;
            border: 2px solid #fff0f0;
            background: #fafafa;
            color: var(--text-main);
            min-width: 200px;
            transition: 0.3s;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--secondary); background: #fff; }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-add:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-cat { background: #6c5ce7; }

        /* Filter Area */
        .filter-area {
            text-align: center;
            margin-bottom: 30px;
        }
        #viewFilter {
            width: 100%;
            max-width: 400px;
            background: white;
            border: 2px solid #fff;
            box-shadow: var(--shadow);
            font-weight: 500;
            text-align-last: center;
        }

        /* Video Grid & Cards */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .video-card {
            background: white;
            padding: 12px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            position: relative;
            transition: 0.3s;
            border: 3px solid #fff;
        }
        .video-card:hover { transform: translateY(-8px); }
        .iframe-wrap {
            position: relative;
            padding-top: 56.25%;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Card Controls */
        .card-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding-top: 12px;
        }
        .tool-btn {
            background: #fdf2f0;
            border: none;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-edit-tool { color: #6c5ce7; }
        .btn-del-tool { color: #ff7675; }
        .tool-btn:hover { background: #fff; transform: scale(1.1); }

        /* Modal UI */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(93, 74, 74, 0.4);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            margin: 15vh auto;
            padding: 30px;
            border-radius: 35px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 5px solid var(--bg);
        }

        #mainApp, .hidden { display: none; }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .btn-add { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า Login -->
    <div id="loginPage" class="login-box">
        <h1 style="font-size: 4rem; margin: 0;">🍧</h1>
        <h1 style="color: var(--primary); margin-top: 0;">Sweet Playlist</h1>
        <p style="color: #a59393; margin-bottom: 40px;">บันทึกวิดีโอที่คุณรักในหมวดหมู่ที่ใช่</p>
        <button class="btn-google" onclick="login()">เข้าสู่ระบบด้วย Google</button>
    </div>

    <!-- หน้าแอปหลัก -->
    <div id="mainApp">
        <div class="header">
            <div class="user-info">
                <img id="userImg" src="">
                <span id="userName" style="font-weight: 500;"></span>
            </div>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#a59393; cursor:pointer; font-size: 0.9rem;">ออกจากระบบ</button>
        </div>

        <div class="admin-panel">
            <span class="label">🌸 สร้างหมวดหมู่ใหม่</span>
            <div class="input-group">
                <select id="parentCatSelect"><option value="none">-- เป็นหมวดหมู่หลัก --</option></select>
                <input type="text" id="catInput" placeholder="พิมพ์ชื่อหมวดหมู่ที่นี่...">
                <button class="btn-add btn-cat" onclick="addCategory()">สร้าง</button>
            </div>
            
            <span class="label">🎥 เพิ่มวิดีโอ YouTube</span>
            <div class="input-group">
                <select id="targetCatSelect"><option value="">-- เลือกหมวดหมู่ --</option></select>
                <input type="text" id="videoUrl" placeholder="วางลิงก์วิดีโอที่นี่...">
                <button class="btn-add" onclick="addVideo()">เพิ่มเข้าเพลย์ลิสต์</button>
            </div>
        </div>

        <div class="filter-area">
            <select id="viewFilter" onchange="renderVideos()">
                <option value="all">🌈 แสดงวิดีโอทั้งหมด</option>
            </select>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<!-- Modal แก้ไข -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--primary);">ย้ายหมวดหมู่ ☁️</h2>
        <select id="editCatSelect" style="width: 100%; margin: 15px 0;"></select>
        <button class="btn-add" style="width: 100%; margin-bottom: 10px;" onclick="saveEdit()">บันทึก</button>
        <button class="tool-btn" style="width: 100%;" onclick="closeModal()">ยกเลิก</button>
    </div>
</div>

<script>
    // ใช้ Config เดิมของคุณ
    const firebaseConfig = {
        apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
        authDomain: "video-playlist-40cf0.firebaseapp.com",
        projectId: "video-playlist-40cf0",
        storageBucket: "video-playlist-40cf0.firebasestorage.app",
        messagingSenderId: "128728975658",
        appId: "1:128728975658:web:255d64e66af8ef66c57653",
        databaseURL: "https://video-playlist-40cf0-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };
    let editingVideoKey = null;

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = "สวัสดี, " + user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            db.ref('users/' + user.uid).on('value', snapshot => {
                myData = snapshot.val() || { categories: {}, videos: {} };
                updateDropdowns();
                renderVideos();
            });
        } else {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        const parentId = document.getElementById('parentCatSelect').value;
        if (!name) return;
        db.ref('users/' + currentUser.uid + '/categories').push({
            name: name,
            parentId: parentId === "none" ? null : parentId
        });
        document.getElementById('catInput').value = '';
    }

    function addVideo() {
        const catId = document.getElementById('targetCatSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = extractID(url);
        if (!catId || !vid) return alert("เลือกหมวดหมู่และวางลิงก์ด้วยนะจ๊ะ");
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId,
            youtubeId: vid,
            addedAt: Date.now()
        });
        document.getElementById('videoUrl').value = '';
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openEditModal(key, currentCatId) {
        editingVideoKey = key;
        const editSelect = document.getElementById('editCatSelect');
        editSelect.innerHTML = document.getElementById('targetCatSelect').innerHTML;
        editSelect.value = currentCatId;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        editingVideoKey = null;
    }

    function saveEdit() {
        const newCatId = document.getElementById('editCatSelect').value;
        if (!newCatId || !editingVideoKey) return;
        db.ref('users/' + currentUser.uid + '/videos/' + editingVideoKey).update({
            catId: newCatId
        }).then(() => closeModal());
    }

    function deleteVideo(key) {
        if(confirm('ลบวิดีโอนี้ใช่ไหมคะ?')) db.ref('users/' + currentUser.uid + '/videos/' + key).remove();
    }

    function updateDropdowns() {
        const pSel = document.getElementById('parentCatSelect');
        const tSel = document.getElementById('targetCatSelect');
        const fSel = document.getElementById('viewFilter');
        const currentFilter = fSel.value;

        const cats = myData.categories || {};
        const mainCats = [];
        const subCats = {};

        for (let id in cats) {
            if (!cats[id].parentId) {
                mainCats.push({ id, ...cats[id] });
            } else {
                if (!subCats[cats[id].parentId]) subCats[cats[id].parentId] = [];
                subCats[cats[id].parentId].push({ id, ...cats[id] });
            }
        }

        let pHTML = '<option value="none">-- เป็นหมวดหมู่หลักใหม่ --</option>';
        let tHTML = '<option value="">-- เลือกหมวดหมู่ --</option>';
        let fHTML = '<option value="all">🌈 แสดงวิดีโอทั้งหมด</option>';

        mainCats.forEach(main => {
            pHTML += `<option value="${main.id}">${main.name}</option>`;
            tHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            fHTML += `<option value="${main.id}" style="font-weight:bold;">${main.name}</option>`;
            if (subCats[main.id]) {
                subCats[main.id].forEach(sub => {
                    tHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                    fHTML += `<option value="${sub.id}">&nbsp;&nbsp;&nbsp;└ ${sub.name}</option>`;
                });
            }
        });

        pSel.innerHTML = pHTML;
        tSel.innerHTML = tHTML;
        fSel.innerHTML = fHTML;
        fSel.value = currentFilter;
    }

    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';

        const videos = myData.videos || {};
        const cats = myData.categories || {};
        
        let allowedCatIds = [filterVal];
        if (filterVal !== 'all') {
            for (let id in cats) {
                if (cats[id].parentId === filterVal) allowedCatIds.push(id);
            }
        }

        const keys = Object.keys(videos).sort((a, b) => (videos[b].addedAt || 0) - (videos[a].addedAt || 0));

        keys.forEach(key => {
            const v = videos[key];
            if (filterVal !== 'all' && !allowedCatIds.includes(v.catId)) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe>
                </div>
                <div class="card-actions">
                    <button class="tool-btn btn-edit-tool" onclick="openEditModal('${key}', '${v.catId}')">แก้ไขหมวด</button>
                    <button class="tool-btn btn-del-tool" onclick="deleteVideo('${key}')">ลบ</button>
                </div>
            `;
            display.appendChild(card);
        });

        if (display.innerHTML === '') {
            display.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #a59393; padding: 40px;">ยังไม่มีวิดีโอในหมวดหมู่นี้เลย 🍡</p>';
        }
    }
</script>
</body>
</html>
