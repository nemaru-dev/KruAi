<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Playlist Cloud sync</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #ff0000; --dark: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        .login-box { text-align: center; margin-top: 100px; }
        .user-profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.9rem; }
        .user-profile img { width: 30px; border-radius: 50%; vertical-align: middle; }
        
        .admin-panel { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        input, select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; min-width: 150px; }
        button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-google { background: white; color: black; font-size: 1rem; }
        .btn-add { background: var(--red); color: white; }
        .btn-logout { background: transparent; color: #aaa; border: 1px solid #444; padding: 5px 10px; }

        /* Dropdown Filter Section */
        .filter-section { margin: 25px 0; border-top: 1px solid #333; pt: 20px; }
        .filter-title { margin-bottom: 10px; color: #aaa; font-size: 0.9rem; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .video-card { background: #000; border-radius: 10px; overflow: hidden; position: relative; }
        .iframe-wrap { position: relative; padding-top: 56.25%; }
        .iframe-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .del-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: red; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; }
        
        #mainApp { display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า Login -->
    <div id="loginPage" class="login-box">
        <h1>🎬 YT Playlist Cloud</h1>
        <p>กรุณาเข้าสู่ระบบเพื่อซิงค์ข้อมูลวิดีโอของคุณ</p>
        <button class="btn-google" onclick="login()">Login with Google</button>
    </div>

    <!-- หน้าหลักหลัง Login -->
    <div id="mainApp">
        <div class="user-profile">
            <div>
                <img id="userImg" src="" alt=""> <span id="userName"></span>
            </div>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div class="admin-panel">
            <p style="margin:0 0 10px 0; font-weight: bold;">+ เพิ่มหมวดหมู่</p>
            <div class="input-group">
                <input type="text" id="catInput" placeholder="เช่น เพลงโปรด, การเรียน...">
                <button class="btn-add" onclick="addCategory()">สร้าง</button>
            </div>
            
            <p style="margin:15px 0 10px 0; font-weight: bold;">+ เพิ่มวิดีโอ</p>
            <div class="input-group">
                <select id="catSelect"><option value="">เลือกหมวดหมู่</option></select>
                <input type="text" id="videoUrl" placeholder="วางลิงก์ YouTube">
                <button class="btn-add" onclick="addVideo()">เพิ่มวิดีโอ</button>
            </div>
        </div>

        <!-- ตัวกรองการแสดงผล -->
        <div class="filter-section">
            <div class="filter-title">เลือกหมวดหมู่ที่จะแสดง:</div>
            <select id="viewFilter" onchange="renderVideos()" style="width: 100%; background: #333; font-weight: bold;">
                <option value="all">แสดงทั้งหมด</option>
            </select>
        </div>

        <div id="videoDisplay" class="video-grid"></div>
    </div>
</div>

<script>
    // --- ตั้งค่า FIREBASE ตรงนี้ ---

// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDWr7Ev6aPzwNPTfuRYp46Pb_a-uJboiXg",
  authDomain: "video-playlist-40cf0.firebaseapp.com",
  projectId: "video-playlist-40cf0",
  storageBucket: "video-playlist-40cf0.firebasestorage.app",
  messagingSenderId: "128728975658",
  appId: "1:128728975658:web:255d64e66af8ef66c57653",
  measurementId: "G-XRSXS6YGJ1"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);


    
//    const firebaseConfig = {
//        apiKey: "YOUR_API_KEY",
//        authDomain: "YOUR_PROJECT.firebaseapp.com",
//        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
//        projectId: "YOUR_PROJECT",
//        storageBucket: "YOUR_PROJECT.appspot.com",
//        messagingSenderId: "YOUR_ID",
//        appId: "YOUR_APP_ID"
//    };
    // ----------------------------

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let myData = { categories: {}, videos: {} };

    // Login/Logout
    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut(); location.reload(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('userName').textContent = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            loadData();
        } else {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    // โหลดข้อมูลจาก Firebase
    function loadData() {
        db.ref('users/' + currentUser.uid).on('value', snapshot => {
            const data = snapshot.val() || { categories: {}, videos: {} };
            myData = data;
            renderDropdowns();
            renderVideos();
        });
    }

    // เพิ่มหมวดหมู่ไปยัง Firebase
    function addCategory() {
        const name = document.getElementById('catInput').value.trim();
        if (!name) return;
        const newCatRef = db.ref('users/' + currentUser.uid + '/categories').push();
        newCatRef.set({ name: name });
        document.getElementById('catInput').value = '';
    }

    // เพิ่มวิดีโอไปยัง Firebase
    function addVideo() {
        const catId = document.getElementById('catSelect').value;
        const url = document.getElementById('videoUrl').value.trim();
        const vid = extractID(url);
        if (!catId || !vid) return alert("กรุณาเลือกหมวดหมู่และใส่ลิงก์ให้ถูกต้อง");
        
        db.ref('users/' + currentUser.uid + '/videos').push().set({
            catId: catId,
            youtubeId: vid
        });
        document.getElementById('videoUrl').value = '';
    }

    function extractID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function deleteVideo(key) {
        if(confirm('ลบวิดีโอนี้?')) db.ref('users/' + currentUser.uid + '/videos/' + key).remove();
    }

    function renderDropdowns() {
        const sel = document.getElementById('catSelect');
        const filter = document.getElementById('viewFilter');
        const currentFilter = filter.value;
        
        let html = '<option value="">-- เลือกหมวดหมู่ --</option>';
        let filterHtml = '<option value="all">📁 แสดงทั้งหมด</option>';
        
        for (let key in myData.categories) {
            html += `<option value="${key}">${myData.categories[key].name}</option>`;
            filterHtml += `<option value="${key}">${myData.categories[key].name}</option>`;
        }
        sel.innerHTML = html;
        filter.innerHTML = filterHtml;
        filter.value = currentFilter;
    }

    function renderVideos() {
        const display = document.getElementById('videoDisplay');
        const filterVal = document.getElementById('viewFilter').value;
        display.innerHTML = '';

        const videos = myData.videos || {};
        for (let key in videos) {
            const v = videos[key];
            // ตรวจสอบการกรอง (Filter)
            if (filterVal !== 'all' && v.catId !== filterVal) continue;

            const div = document.createElement('div');
            div.className = 'video-card';
            div.innerHTML = `
                <div class="iframe-wrap">
                    <iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe>
                </div>
                <button class="del-btn" onclick="deleteVideo('${key}')">×</button>
            `;
            display.appendChild(div);
        }
    }
</script>

</body>
</html>
